name: Publish CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Download the deployed public Skill mirror
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-delay 3
          https://exportdou.cn/SKILL.md
          --output "${RUNNER_TEMP}/exportdou-public-SKILL.md"
      - run: npm test
        env:
          EXPORTDOU_PUBLIC_SKILL_PATH: ${{ runner.temp }}/exportdou-public-SKILL.md
      - name: Publish when this version is not already on npm
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "exportdou@${version}" version >/dev/null 2>&1; then
            echo "exportdou@${version} is already published"
          else
            npm publish --workspace exportdou --access public
          fi
